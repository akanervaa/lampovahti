# Wokwi-simulaattorin asetukset. Kytkennät ovat diagram.json-tiedostossa.
[wokwi]
version = 1
firmware = 'firmware/build/zephyr/zephyr.elf'
elf = 'firmware/build/zephyr/zephyr.elf'
gdbServerPort = 3333

# MYS-1 on Wokwin itse tehty piiri (WebAssembly). Kopio kurssin projektista 0063-mystery-sensor.
[[chip]]
name = 'mystery'
binary = 'chips/mystery.chip.wasm'
