# Lämpövahti: Kconfig-asetukset. Jokaisella rivillä on syy; ks. DESIGN.md.

# --- Loki (F6) -----------------------------------------------------------------------------
# (1) Lokijärjestelmän pääkytkin. Ilman tätä kaikki LOG_*-kutsut katoavat käännöksestä.
CONFIG_LOG=y

# (2) Oletustaso moduuleille, jotka eivät kerro omaansa: 1=ERR 2=WRN 3=INF 4=DBG.
#     Kehityksen aikana halutaan nähdä tapahtumat (info), mutta ei kaikkea debug-tulostetta.
CONFIG_LOG_DEFAULT_LEVEL=3

# (3) SUUNNITTELUPÄÄTÖS: milloin lokirivi oikeasti tulostetaan?
#
#     CONFIG_LOG_MODE_IMMEDIATE=y
#         Tulostetaan heti, samassa threadissa, joka kutsui LOG_INF:ää. Kutsuja odottaa,
#         kunnes rivi on UARTissa.
#     CONFIG_LOG_MODE_DEFERRED=y
#         LOG_INF vain laittaa viestin puskuriin ja palaa heti. Zephyrin oma lokithread
#         (alin prioriteetti, DESIGN.md 4.4) tulostaa sen myöhemmin.
#
#     Mieti: control-thread kirjaa lokiin esimerkiksi anturivian. Muista vaiheen 0 mittaus:
#     printk ja UART ovat hitaita. Kumpi tila sopii suunnitelmaamme, ja mitä se maksaa?
#     Kirjoita alle valitsemasi rivi.
CONFIG_LOG_MODE_DEFERRED=y

