# Lämpövahti: Kconfig-asetukset. Jokaisella rivillä on syy; ks. DESIGN.md.

# --- Loki (F6) -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Deferred: LOG_* palaa heti, alimman prioriteetin lokithread tulostaa myöhemmin. Ks. DESIGN.md.
CONFIG_LOG_MODE_DEFERRED=y

# --- Anturi (F1) ---------------------------------------------------------------------------
CONFIG_I2C=y

# --- Lämmitin-LED (F2) ---------------------------------------------------------------------
CONFIG_GPIO=y

# --- Wokwi: ajat ---------------------------------------------------------------------------
# Oikean raudan oletukset ovat tiedostossa Kconfig. Wokwissa MYS-1 antaa uuden näytteen noin
# 7 s välein Zephyrin kellolla mitattuna (DESIGN.md, avoimet kysymykset), joten datalehden 2 s
# aikakatkaisu tulkitsisi toimivan anturin rikki menneeksi.
#
# (1) Valitse Wokwille DRDY-aikakatkaisu millisekunteina. Mitattu väli oli noin 7000 ms.
#     Mieti: kuinka paljon marginaalia jätät, ja mitä tapahtuu, jos arvo on liian pieni tai
#     liian suuri? (Liian suuri: kuinka kauan kestää huomata OIKEA anturivika?)
CONFIG_LAMPO_DRDY_TIMEOUT_MS=15000
